version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: fashion_ai_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password123
      MONGO_INITDB_DATABASE: fashion_ai_db
    volumes:
      - mongodb_data:/data/db
    networks:
      - fashion_ai_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fashion_ai_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=development
      - MONGODB_URL=mongodb://admin:password123@mongodb:27017/fashion_ai_db?authSource=admin
    depends_on:
      - mongodb
    networks:
      - fashion_ai_network
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  mongodb_data:

networks:
  fashion_ai_network:
    driver: bridge 